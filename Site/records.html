<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZAS | Medical Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo-area">🏥 ZAS <span>Connect</span></div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="appointments.html">Appointments</a></li>
            <li><a href="records.html" class="active">Medical Records</a></li>
            <li><a href="#">Messages</a></li>
        </ul>
    </nav>

    <main class="main-wrapper">
        <header class="header-row">
            <h1>My Health Records</h1>
            <button class="btn-secondary">Upload External File</button>
        </header>

        <div class="content-card">
            <div class="filter-row">
                <input type="text" placeholder="Search by doctor or test name...">
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Document Type</th>
                        <th>Clinic</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>May 3, 2026</td>
                        <td>Blood Analysis</td>
                        <td>ZAS Cadix Lab</td>
                        <td><span class="tag-final">Final</span></td>
                        <td><button class="btn-sm">View PDF</button></td>
                    </tr>
                    <tr>
                        <td>April 12, 2026</td>
                        <td>Radiology (MRI)</td>
                        <td>ZAS Middelheim</td>
                        <td><span class="tag-final">Final</span></td>
                        <td><button class="btn-sm">View Images</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
